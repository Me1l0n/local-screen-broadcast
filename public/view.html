<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Stream — OBS View</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Shown only while waiting for stream */
    #waiting {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: .65rem;
      background: #000;
      color: rgba(255,255,255,.35);
      font-family: 'Segoe UI', sans-serif;
      font-size: .9rem;
      z-index: 10;
    }
    #waiting.hidden { display: none; }
    .spin { font-size: 1.6rem; animation: spin 1.4s linear infinite; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<div id="waiting">
  <span class="spin">⏳</span>
  Ожидание игрока...
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const playerNumber = params.get('player');

  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  let peer = null;

  // Force H.264: hardware GPU decode vs. software VP8/VP9
  function preferH264(peer) {
    try {
      const caps = RTCRtpReceiver.getCapabilities('video');
      if (!caps) return;
      const h264 = caps.codecs.filter(c => /h264/i.test(c.mimeType));
      const rest = caps.codecs.filter(c => !/h264/i.test(c.mimeType));
      const sorted = [...h264, ...rest];
      peer.getTransceivers().forEach(t => {
        try { t.setCodecPreferences(sorted); } catch (_) {}
      });
    } catch (_) {}
  }

  const video   = document.getElementById('video');
  const waiting = document.getElementById('waiting');

  const socket = io();

  socket.on('connect', () => {
    if (playerNumber) socket.emit('join-view', { playerNumber });
  });

  // Offer comes from streamer
  socket.on('offer', async ({ fromSocketId, offer }) => {
    peer = new RTCPeerConnection(rtcConfig);

    peer.ontrack = (ev) => {
      video.srcObject = ev.streams[0];
      video.play().then(() => waiting.classList.add('hidden')).catch(() => {});
    };

    peer.onicecandidate = (ev) => {
      if (ev.candidate)
        socket.emit('ice-candidate', { targetSocketId: fromSocketId, candidate: ev.candidate });
    };

    peer.onconnectionstatechange = () => {
      if (['disconnected','failed','closed'].includes(peer.connectionState)) {
        waiting.classList.remove('hidden');
        video.srcObject = null;
      }
    };

    await peer.setRemoteDescription(offer);
    preferH264(peer);  // switch to GPU-decoded H.264
    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    socket.emit('answer', { targetSocketId: fromSocketId, answer });
  });

  socket.on('ice-candidate', async ({ fromSocketId, candidate }) => {
    if (peer && candidate) {
      try { await peer.addIceCandidate(candidate); } catch (_) {}
    }
  });
</script>
</body>
</html>
